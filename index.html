<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>অফিস হিসাব | মাহবুবুর রহমান</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans Bengali", sans-serif;
    background: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    width: 90%;
    max-width: 420px;
    background: white;
    padding: 35px 25px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    text-align: center;
}

.logo {
    font-size: 50px;
    margin-bottom: 10px;
}

h1 {
    margin: 5px 0;
    font-size: 26px;
    color: #1e293b;
}

.subtitle {
    color: #64748b;
    margin-bottom: 25px;
}

label {
    display: block;
    text-align: left;
    margin: 12px 0 6px;
    font-weight: bold;
    color: #334155;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: 0;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#error {
    color: #dc2626;
    margin-top: 15px;
    display: none;
}

#success {
    color: #16a34a;
    margin-top: 15px;
    display: none;
    font-weight: bold;
}

.footer {
    margin-top: 25px;
    font-size: 13px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">🔐</div>

    <h1>অফিস হিসাব সিস্টেম</h1>

    <div class="subtitle">
        মাহবুবুর রহমান<br>
        দলিল লেখক ও স্ট্যাম্প ভেন্ডার
    </div>

    <label for="username">ইউজার নাম</label>
    <input type="text" id="username" placeholder="ইউজার নাম লিখুন">

    <label for="password">পাসওয়ার্ড</label>
    <input type="password" id="password" placeholder="পাসওয়ার্ড লিখুন">

    <button onclick="login()">লগইন করুন</button>

    <div id="error">
        ইউজার নাম অথবা পাসওয়ার্ড ভুল!
    </div>

    <div id="success">
        লগইন সফল হয়েছে!
    </div>

    <div class="footer">
        ব্যক্তিগত অফিস ব্যবহারের জন্য
    </div>

</div>

<script>
function login() {

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const error = document.getElementById("error");
    const success = document.getElementById("success");

    if (username === "admin" && password === "1234") {

        error.style.display = "none";
        success.style.display = "block";

        alert("লগইন সফল হয়েছে!");

        window.location.href = "dashboard.html";

    } else {

        success.style.display = "none";
        error.style.display = "block";

    }
}
</script>
